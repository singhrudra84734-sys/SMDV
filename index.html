<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Video Downloader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 500px; text-align: center; }
        h1 { margin-bottom: 20px; color: #ff4757; font-size: 24px; }
        p { color: #aaa; margin-bottom: 20px; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #333; background: #2a2a2a; color: #fff; border-radius: 6px; margin-bottom: 15px; outline: none; font-size: 16px; }
        input[type="text"]:focus { border-color: #ff4757; }
        button { width: 100%; padding: 12px; background: #ff4757; border: none; color: #fff; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e84118; }
        .loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #ff4757; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .result { margin-top: 25px; display: none; background: #2a2a2a; padding: 15px; border-radius: 8px; }
        .result img { max-width: 100%; border-radius: 6px; margin-bottom: 10px; }
        .download-btn { display: inline-block; background: #2ed573; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px; }
        .download-btn:hover { background: #26af5f; }
        .error { color: #ff4757; margin-top: 15px; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 Online Video Downloader</h1>
    <p>YouTube, Facebook, Twitter ya Instagram video ka link niche paste karein:</p>
    
    <input type="text" id="videoUrl" placeholder="https://youtube.com...">
    <button onclick="fetchVideo()">Download Link Generate Karein</button>
    
    <div class="loader" id="loader"></div>
    <div class="error" id="errorMsg">Kuch galat hua! Kripya sahi URL dalein ya thodi der baad koshish karein.</div>
    
    <div class="result" id="resultBox">
        <h3 id="videoTitle" style="font-size: 16px; margin-bottom: 10px;">Video Title</h3>
        <img id="videoThumb" src="" alt="Thumbnail">
        <br>
        <a id="downloadLink" class="download-btn" href="#" target="_blank" download>💾 Video Download Karein</a>
    </div>
</div>

<script>
    async function fetchVideo() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('resultBox');
        const errorMsg = document.getElementById('errorMsg');
        
        if (!urlInput) {
            alert('Kripya pehle video link paste karein!');
            return;
        }
        
        // UI Reset
        loader.style.display = 'block';
        resultBox.style.display = 'none';
        errorMsg.style.display = 'none';
        
        try {
            // Hum ek free public video downloader API ka use kar rahe hain
            const apiUrl = `https://api-host.com{encodeURIComponent(urlInput)}`; 
            // Note: Agar upar wali API block ho jaye, toh aap 'cobalt api' ya 'all-in-one downloader api' rapidapi se replace kar sakte hain.
            
            const response = await fetch(`https://cobalt.tools`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ url: urlInput })
            });
            
            const data = await response.json();
            
            if (data && data.url) {
                loader.style.display = 'none';
                resultBox.style.display = 'block';
                
                document.getElementById('videoTitle').innerText = "Aapka video download ke liye taiyar hai!";
                document.getElementById('videoThumb').style.display = 'none'; // Cobalt thumbnail nahi deta direct
                
                const dBtn = document.getElementById('downloadLink');
                dBtn.href = data.url;
            } else {
                throw new Error('Invalid response');
            }
            
        } catch (error) {
            loader.style.display = 'none';
            errorMsg.style.display = 'block';
            console.error(error);
        }
    }
</script>

</body>
</html>
