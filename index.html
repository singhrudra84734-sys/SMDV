<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMDV - Premium YT Thumbnail Downloader</title>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .logo span {
            color: #00ff87;
        }

        .card {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        p {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 14px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #00ff87;
        }

        input[type="text"]::placeholder {
            color: #484f58;
        }

        .btn-fetch {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            border: none;
            border-radius: 14px;
            color: #000000;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
        }

        .btn-fetch:hover {
            opacity: 0.9;
        }

        .btn-fetch:active {
            transform: scale(0.98);
        }

        /* Result Area */
        .result-area {
            margin-top: 25px;
            display: none;
        }

        .thumbnail-preview {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #30363d;
        }

        .btn-download {
            display: block;
            width: 100%;
            padding: 14px;
            background: #00ff87;
            border: none;
            color: #000000;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-download:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: #ff7b72;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="logo">SM<span>DV</span></div>

        <div class="card">
            <h1>YT Thumbnail Downloader</h1>
            <p>लिंक डालें और सीधे अपनी गैलरी या कंप्यूटर में HD थंबनेल डाउनलोड करें।</p>

            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="Paste your YouTube video URL link here...">
                <div class="error-msg" id="errorMsg"></div>
            </div>

            <button class="btn-fetch" id="fetchBtn" onclick="fetchThumbnail()">Fetch Thumbnail</button>

            <!-- Result Section -->
            <div class="result-area" id="resultArea">
                <img src="" alt="Thumbnail Preview" class="thumbnail-preview" id="thumbPreview">
                <button class="btn-download" id="downloadBtn">Download to Device</button>
            </div>
        </div>
    </div>

    <script>
        async function fetchThumbnail() {
            const videoUrl = document.getElementById('videoUrl').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const resultArea = document.getElementById('resultArea');
            const thumbPreview = document.getElementById('thumbPreview');
            const downloadBtn = document.getElementById('downloadBtn');
            const fetchBtn = document.getElementById('fetchBtn');

            // Reset UI
            errorMsg.style.display = 'none';
            resultArea.style.display = 'none';

            if (!videoUrl) {
                errorMsg.innerText = "कृपया पहले लिंक पेस्ट करें!";
                errorMsg.style.display = 'block';
                return;
            }

            let videoId = "";
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = videoUrl.match(regExp);

            if (match && match[2].length === 11) {
                videoId = match[2];
            } else {
                errorMsg.innerText = "गलत YouTube URL! कृपया सही लिंक डालें।";
                errorMsg.style.display = 'block';
                return;
            }

            // Max Resolution Thumbnail (Proxy to bypass CORS if needed)
            const thumbnailUrl = `https://youtube.com{videoId}/maxresdefault.jpg`;
            
            // Preview दिखाना
            thumbPreview.src = thumbnailUrl;
            resultArea.style.display = 'block';

            // डायरेक्ट डाउनलोड लॉजिक (नो रीडायरेक्ट)
            downloadBtn.onclick = async function() {
                downloadBtn.innerText = "Downloading...";
                downloadBtn.style.opacity = "0.7";
                
                try {
                    // इमेज को फेच करके Blob में बदलना
                    const response = await fetch(thumbnailUrl);
                    const blob = await response.blob();
                    
                    // लोकल डाउनलोड लिंक बनाना
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = `smdv-thumbnail-${videoId}.jpg`;
                    
                    document.body.appendChild(a);
                    a.click();
                    
                    // क्लीनअप
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                } catch (error) {
                    // अगर CORS इशू आये तो बैकअप के तौर पर नए टैब में ओपन करना
                    window.open(thumbnailUrl, '_blank');
                } finally {
                    downloadBtn.innerText = "Download to Device";
                    downloadBtn.style.opacity = "1";
                }
            };
        }
    </script>
</body>
</html>
