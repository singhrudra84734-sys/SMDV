<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMDV - Premium QR Code Generator</title>
    <!-- QR Code Library for generating QR Easily -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .logo span {
            color: #00ff87;
        }

        .card {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 14px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            resize: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #00ff87;
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            border: none;
            border-radius: 14px;
            color: #000000;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
        }

        .btn-generate:hover { opacity: 0.9; }

        /* QR Display Area */
        .result-area {
            margin-top: 30px;
            display: none;
        }

        #qrcode {
            background: #ffffff;
            padding: 15px;
            border-radius: 14px;
            display: inline-block;
            margin-bottom: 20px;
        }

        #qrcode img {
            margin: 0 auto;
        }

        .btn-download {
            display: block;
            width: 100%;
            padding: 14px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #ffffff;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-download:hover {
            background: #30363d;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="logo">SM<span>DV</span></div>

        <div class="card">
            <h1>Premium QR Generator</h1>
            <p>कोई भी टेक्स्ट या वेबसाइट लिंक डालें और तुरंत अपना QR कोड डाउनलोड करें।</p>

            <div class="input-group">
                <textarea id="qrText" placeholder="यहाँ अपना लिंक या टेक्स्ट पेस्ट करें..."></textarea>
            </div>

            <button class="btn-generate" onclick="generateQR()">Generate QR Code</button>

            <!-- Result Section -->
            <div class="result-area" id="resultArea">
                <div id="qrcode"></div>
                <button class="btn-download" onclick="downloadQR()">Download QR Code</button>
            </div>
        </div>
    </div>

    <script>
        let qrcodeContainer = document.getElementById("qrcode");
        let qrCodeInstance = null;

        function generateQR() {
            let qrText = document.getElementById("qrText").value.trim();
            let resultArea = document.getElementById("resultArea");

            if (!qrText) {
                alert("कृपया पहले कुछ टेक्स्ट या लिंक दर्ज करें!");
                return;
            }

            // पुराना QR साफ़ करना
            qrcodeContainer.innerHTML = "";

            // नया QR जनरेट करना
            qrCodeInstance = new QRCode(qrcodeContainer, {
                text: qrText,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            resultArea.style.display = "block";
        }

        function downloadQR() {
            // QR इमेज को खोजकर उसे डाउनलोड करना
            let qrImg = qrcodeContainer.querySelector("img");
            if (qrImg) {
                let a = document.createElement("a");
                a.href = qrImg.src;
                a.download = "smdv-qrcode.png";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } else {
                // Canvas फॉलबैक अगर इमेज तुरंत लोड न हो
                let qrCanvas = qrcodeContainer.querySelector("canvas");
                let a = document.createElement("a");
                a.href = qrCanvas.toDataURL("image/png");
                a.download = "smdv-qrcode.png";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }
    </script>
</body>
</html>
