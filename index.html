<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMDV - Ultimate Thumbnail Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .logo span {
            color: #00ff87;
        }

        .card {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 14px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #00ff87;
        }

        .btn-fetch {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
            border: none;
            border-radius: 14px;
            color: #000000;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
        }

        .btn-fetch:hover { opacity: 0.9; }

        .error-msg {
            color: #ff7b72;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        .result-area {
            margin-top: 30px;
            display: none;
        }

        .thumb-box {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }

        .thumb-box img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 12px;
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .btn-download {
            display: block;
            width: 100%;
            padding: 12px;
            background: #00ff87;
            border: none;
            color: #000000;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="logo">SM<span>DV</span></div>

        <div class="card">
            <h1>YT Thumbnail Downloader</h1>
            <p>यहाँ लिंक पेस्ट करें और सीधे अपनी गैलरी में सेव करें।</p>

            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="Paste your YouTube video URL link here...">
                <div class="error-msg" id="errorMsg"></div>
            </div>

            <button class="btn-fetch" onclick="generateThumbnails()">Fetch Thumbnail</button>

            <!-- Results Box -->
            <div class="result-area" id="resultArea">
                <div class="thumb-box">
                    <img id="imgPreview" src="" alt="Preview">
                    <button class="btn-download" id="downloadBtn" onclick="forceDownload()">Save to Gallery</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentVideoId = "";

        // बिल्कुल परफेक्ट काम करने वाला ID डिटेक्टर
        function getYouTubeId(url) {
            url = url.trim();
            if (url.length === 11 && !url.includes("/") && !url.includes(".")) {
                return url;
            }
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|shorts\/|live\/|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            
            // यहाँ गड़बड़ थी, अब सही ग्रुप [2] से वीडियो ID निकाली जा रही है
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function generateThumbnails() {
            const videoUrl = document.getElementById('videoUrl').value;
            const errorMsg = document.getElementById('errorMsg');
            const resultArea = document.getElementById('resultArea');

            errorMsg.style.display = 'none';
            resultArea.style.display = 'none';

            if (!videoUrl.trim()) {
                errorMsg.innerText = "कृपया पहले लिंक पेस्ट करें!";
                errorMsg.style.display = 'block';
                return;
            }

            const videoId = getYouTubeId(videoUrl);

            if (videoId) {
                currentVideoId = videoId;
                document.getElementById('imgPreview').src = `https://youtube.com{currentVideoId}/maxresdefault.jpg`;
                resultArea.style.display = 'block';
            } else {
                errorMsg.innerText = "गलत YouTube URL! कृपया सही लिंक दर्ज करें।";
                errorMsg.style.display = 'block';
            }
        }

        // डाउनलोड फंक्शन बिना किसी ब्लॉकिंग एरर के
        async function forceDownload() {
            const btn = document.getElementById('downloadBtn');
            btn.innerText = "Saving...";
            btn.style.opacity = "0.7";

            const proxyUrl = "https://corsproxy.io?";
            const targetImgUrl = `https://youtube.com{currentVideoId}/maxresdefault.jpg`;

            try {
                const response = await fetch(proxyUrl + encodeURIComponent(targetImgUrl));
                if (!response.ok) throw new Error("Proxy error");
                
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `smdv-thumbnail-${currentVideoId}.jpg`;
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (error) {
                window.open(targetImgUrl, '_blank');
            } finally {
                btn.innerText = "Save to Gallery";
                btn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
