    <style>
        :root {

            --lime-glow: rgba(0, 255, 135, 0.25);
            --text-color: #F8FAFC;

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 25px; animation: cyberpunkFade 0.8s cubic-bezier(0.16, 1, 0.3, 1); }

        .logo-area { text-align: center; font-size: 2.5rem; font-weight: 900; letter-spacing: 2px; color: #ffffff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }

        .main-card { background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 30px; padding: 35px 25px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 25px; }
        .input-group { display: flex; flex-direction: column; gap: 15px; }
        
        input[type="text"] { width: 100%; padding: 18px 20px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; color: #ffffff; font-size: 1rem; outline: none; text-align: center; }
        input[type="text"]:focus { border-color: var(--lime-neon); box-shadow: 0 0 20px var(--lime-glow); }
        
        /* Form Submit Button Styled Perfectly */
        .submit-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #00FF87 0%, #60EFFF 100%); border: none; border-radius: 16px; color: #0F172A; font-size: 1.1rem; font-weight: 800; cursor: pointer; box-shadow: 0 8px 25px rgba(0, 255, 135, 0.35); transition: transform 0.2s; }

        .grid-card h2 { font-size: 1.1rem; text-align: center; color: var(--text-muted); margin-bottom: 18px; }
        .platform-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .platform-item { background: rgba(15, 23, 42, 0.4); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 16px; padding: 15px 10px; text-align: center; font-size: 0.85rem; color: var(--text-color); }
