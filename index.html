<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Social Media Video Downloader - Insta, YT, TikTok</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; width: 100%; background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; margin-top: 20px; }
        h1 { color: #ff3366; margin-bottom: 10px; font-size: 28px; }
        p { color: #aaa; margin-bottom: 25px; font-size: 14px; }
        .input-group { display: flex; flex-direction: column; gap: 12px; }
        input { width: 100%; padding: 15px; border: 2px solid #333; border-radius: 8px; background: #2a2a2a; color: #fff; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: #ff3366; }
        button { width: 100%; padding: 15px; background: #ff3366; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e02454; }
        .loading { display: none; margin: 20px 0; color: #ff3366; font-weight: bold; }
        .result-box { display: none; margin-top: 25px; padding: 20px; background: #2a2a2a; border-radius: 8px; border: 1px solid #444; }
        .result-box img { max-width: 100%; border-radius: 8px; margin-bottom: 15px; max-height: 200px; object-fit: cover; }
        .download-btn { display: inline-block; width: 100%; padding: 12px; background: #00ca72; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 10px; }
        .download-btn:hover { background: #00b162; }
        .ad-space { width: 100%; display: flex; justify-content: center; align-items: center; margin: 20px 0; min-height: 60px; overflow: hidden; }
    </style>
</head>
<body>

    <!-- 🟢 1st AD CODE (Top Banner - 728x90) -->
    <div class="ad-space">
        <script>
          atOptions = {
            'key' : '407953d4e5ca65704f8161bb59cdc6b0',
            'format' : 'iframe',
            'height' : 90,
            'width' : 728,
            'params' : {}
          };
        </script>
        <script src="https://www.highrevenueformat.com/407953d4e5ca65704f8161bb59cdc6b0/invoke.js"></script>
    </div>

    <div class="container">
        <h1>All-in-One Video Downloader</h1>
        <p>Download Videos from Instagram, YouTube, TikTok & More instantly!</p>
        
        <div class="input-group">
            <input type="url" id="videoUrl" placeholder="Paste social media video link here..." required>
            <button onclick="downloadVideo()">Fetch Video</button>
        </div>

        <!-- 🔵 2nd AD CODE (Middle Banner - 468x60) -->
        <div class="ad-space" style="margin-top: 25px; min-height: 60px;">
            <script>
              atOptions = {
                'key' : '2e85e55626de22317840450093cc4f00',
                'format' : 'iframe',
                'height' : 60,
                'width' : 468,
                'params' : {}
              };
            </script>
            <script src="https://www.highrevenueformat.com/2e85e55626de22317840450093cc4f00/invoke.js"></script>
        </div>

        <div class="loading" id="loadingText">Processing your link... Please wait...</div>

        <!-- रिजल्ट बॉक्स जहाँ डाउनलोड बटन दिखेगा -->
        <div class="result-box" id="resultBox">
            <h3 style="color: #00ca72; margin-bottom: 10px;">Video Ready!</h3>
            <img id="videoThumb" src="" alt="Video Thumbnail">
            <p id="videoTitle" style="color: #fff; font-size: 14px; margin-bottom: 15px;"></p>
            <a href="" id="downloadLink" class="download-btn" target="_blank" download>⬇️ Download Video</a>
        </div>
    </div>

    <script>
        async function downloadVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loadingText = document.getElementById('loadingText');
            const resultBox = document.getElementById('resultBox');
            const downloadLink = document.getElementById('downloadLink');
            const videoThumb = document.getElementById('videoThumb');
            const videoTitle = document.getElementById('videoTitle');

            if (!urlInput) {
                alert("Please paste a valid URL first!");
                return;
            }

            loadingText.style.display = "block";
            resultBox.style.display = "none";

            try {
                // वीडियो फेच करने के लिए फ्री API वर्कर
                const response = await fetch(`https://workers.dev{encodeURIComponent(urlInput)}`);
                const data = await response.json();

                if (data && data.data && data.data.url) {
                    videoThumb.src = data.data.thumbnail || "https://placeholder.com";
                    videoTitle.innerText = data.data.title || "Social Media Video";
                    downloadLink.href = data.data.url;
                    
                    loadingText.style.display = "none";
                    resultBox.style.display = "block";
                } else {
                    throw new Error("Invalid response from server");
                }
            } catch (error) {
                console.error(error);
                loadingText.style.display = "none";
                alert("Oops! Unable to fetch video. Please check the link or try another video.");
            }
        }
    </script>
</body>
</html>
